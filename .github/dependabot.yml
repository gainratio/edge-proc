# Weekly dependency updates, grouped to keep PR noise low (house standard §4).
# Each ecosystem consolidates into a single reviewable PR per run instead of a
# flood of one-per-dependency PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # pyproject.toml carries deliberate floors (tests/test_dependency_floors.py);
    # Dependabot may only move uv.lock, never rewrite a manifest floor.
    versioning-strategy: lockfile-only
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
