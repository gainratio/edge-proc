# Monthly dependency updates: one grouped minor+patch PR per ecosystem.
# Semver-major updates are ignored here on purpose: majors are migrated by hand in a
# human-written PR, so a Dependabot PR goes red only for real breakage.
# cooldown: wait 7 days after a release before proposing it (lets bad releases get yanked).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors are migrated by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # pyproject.toml carries deliberate floors (tests/test_dependency_floors.py);
    # Dependabot may only move uv.lock, never rewrite a manifest floor.
    versioning-strategy: lockfile-only
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors are migrated by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
