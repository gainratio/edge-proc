# Re-pins lock-derived tool literals on Dependabot uv pull requests.
#
# Why: tests/test_ci_dependency_graph.py and the Dagger module pin the exact hatchling
# and pip-audit versions Dagger runs. Those literals copy uv.lock, so every Dependabot
# bump of either tool failed CI until a human copied the new version by hand. This
# workflow does that copy; the pin tests are unchanged and still fail on any drift.
#
# Security shape (GitHub docs: "Automating Dependabot with GitHub Actions" and
# "Troubleshooting Dependabot on GitHub Actions"):
# - Triggered by `pull_request` only. Dependabot runs get a read-only GITHUB_TOKEN and
#   no Actions secrets by default; `permissions` raises this one job's token. No secrets.
# - Runs only when the PR author is dependabot[bot] and the branch lives in this repo.
# - Executes no code from the pull request: the checkout is the base commit, so the
#   Dagger module and scripts/repin_locked_tools.py are the reviewed versions. The tool
#   fetches only uv.lock and two text files of the head, as text, through the REST API.
# - Fleet policy shape (hseshadr/ci fleet_policy.py): checkout then Dagger, no run step.
#   Event values reach Dagger only through the step environment, never pasted in args.
# - Commits through createCommitOnBranch bound to the head SHA, so a concurrent
#   Dependabot push wins, then cancels CI on the superseded commit (Dagger function
#   repin-dependabot). GitHub puts the
#   pull_request run for a GITHUB_TOKEN commit in an approval-required state: one
#   "Approve workflows to run" click starts the required Dagger check.
name: Dependabot re-pin
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: edge-proc-repin-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  repin:
    name: Re-pin lock-derived tool literals
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/uv/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the re-pinned literals to the Dependabot branch
      actions: write # cancel the run on the superseded commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          version: "0.21.8"
          verb: call
          args: repin-dependabot --github-token=env:GH_TOKEN --pr-number="$PR_NUMBER" --repository="$GITHUB_REPOSITORY"
